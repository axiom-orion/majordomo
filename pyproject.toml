[project]
name = "majordomo"
version = "0.1.0"
description = "The concierge that never forgets — a MemoryAgent with governed, self-evaluating persistent memory on Qwen Cloud."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
charts = ["matplotlib>=3.9.0"]

[project.scripts]
majordomo = "majordomo.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
