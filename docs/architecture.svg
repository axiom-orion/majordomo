<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- background so it reads on any surface -->
  <rect x="0" y="0" width="1000" height="500" fill="#0f172a"/>
  <rect x="0" y="0" width="1000" height="500" fill="none"/>

  <!-- title -->
  <text x="30" y="42" fill="#f8fafc" font-size="26" font-weight="700">Majordomo — governed persistent memory</text>
  <text x="30" y="66" fill="#94a3b8" font-size="14">Qwen Cloud · Alibaba Cloud Model Studio (DashScope) · Function Compute</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- ================= REMEMBER (write path) ================= -->
  <text x="30" y="108" fill="#38bdf8" font-size="14" font-weight="700" letter-spacing="1">REMEMBER — write path</text>

  <!-- Conversation -->
  <rect x="20" y="120" width="150" height="86" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="95" y="158" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">Conversation</text>
  <text x="95" y="178" fill="#94a3b8" font-size="12" text-anchor="middle">guest transcript</text>

  <!-- EXTRACT -->
  <rect x="210" y="120" width="160" height="86" rx="10" fill="#164e63" stroke="#0891b2"/>
  <text x="290" y="150" fill="#f0f9ff" font-size="14" font-weight="700" text-anchor="middle">EXTRACT</text>
  <text x="290" y="170" fill="#a5f3fc" font-size="11.5" text-anchor="middle">qwen3.7-plus · JSON</text>
  <text x="290" y="187" fill="#94a3b8" font-size="11" text-anchor="middle">atomic durable facts</text>

  <!-- DEDUPE -->
  <rect x="410" y="120" width="160" height="86" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="490" y="150" fill="#e2e8f0" font-size="14" font-weight="700" text-anchor="middle">DEDUPE</text>
  <text x="490" y="170" fill="#94a3b8" font-size="11.5" text-anchor="middle">sim ≥ 0.90</text>
  <text x="490" y="187" fill="#94a3b8" font-size="11" text-anchor="middle">→ reinforce, don't store</text>

  <!-- SUPERSEDE -->
  <rect x="610" y="120" width="170" height="86" rx="10" fill="#164e63" stroke="#0891b2"/>
  <text x="695" y="147" fill="#f0f9ff" font-size="14" font-weight="700" text-anchor="middle">SUPERSEDE</text>
  <text x="695" y="166" fill="#a5f3fc" font-size="11.5" text-anchor="middle">qwen3.7-max · judge</text>
  <text x="695" y="183" fill="#94a3b8" font-size="11" text-anchor="middle">contradiction? retire w/ provenance</text>

  <!-- STORE -->
  <rect x="820" y="120" width="160" height="86" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="900" y="150" fill="#e2e8f0" font-size="14" font-weight="700" text-anchor="middle">STORE</text>
  <text x="900" y="170" fill="#94a3b8" font-size="11.5" text-anchor="middle">importance +</text>
  <text x="900" y="187" fill="#94a3b8" font-size="11" text-anchor="middle">provenance (audit)</text>

  <!-- write-path arrows -->
  <line x1="170" y1="163" x2="208" y2="163" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="370" y1="163" x2="408" y2="163" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="163" x2="608" y2="163" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="163" x2="818" y2="163" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ledger band -->
  <rect x="20" y="250" width="960" height="70" rx="10" fill="#0b1220" stroke="#334155"/>
  <text x="40" y="278" fill="#e2e8f0" font-size="14" font-weight="700">MEMORY LEDGER</text>
  <text x="40" y="299" fill="#94a3b8" font-size="12">active memories + superseded (retained, reason recorded) — nothing is silently deleted · SQLite → ApsaraDB RDS</text>
  <!-- store down into ledger -->
  <line x1="900" y1="206" x2="900" y2="248" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= RECALL (read path) ================= -->
  <text x="30" y="366" fill="#a78bfa" font-size="14" font-weight="700" letter-spacing="1">RECALL — read path</text>

  <!-- Query -->
  <rect x="20" y="380" width="150" height="86" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="95" y="418" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">Guest request</text>
  <text x="95" y="438" fill="#94a3b8" font-size="12" text-anchor="middle">this turn</text>

  <!-- RECALL scoring -->
  <rect x="300" y="380" width="380" height="86" rx="10" fill="#312e81" stroke="#6366f1"/>
  <text x="490" y="410" fill="#eef2ff" font-size="14" font-weight="700" text-anchor="middle">HYBRID RECALL</text>
  <text x="490" y="432" fill="#c7d2fe" font-size="13" text-anchor="middle">score = cosine × importance × recency × reinforcement</text>
  <text x="490" y="450" fill="#a5b4fc" font-size="11" text-anchor="middle">relevant · current · repeatedly confirmed</text>

  <!-- Response -->
  <rect x="820" y="380" width="160" height="86" rx="10" fill="#14532d" stroke="#22c55e"/>
  <text x="900" y="418" fill="#f0fdf4" font-size="14" font-weight="700" text-anchor="middle">Grounded reply</text>
  <text x="900" y="438" fill="#bbf7d0" font-size="11.5" text-anchor="middle">acts on memory</text>

  <!-- read-path arrows -->
  <line x1="170" y1="423" x2="298" y2="423" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="423" x2="818" y2="423" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- ledger feeds recall -->
  <line x1="490" y1="320" x2="490" y2="378" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
