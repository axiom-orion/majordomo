name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Deterministic offline backend: no API keys or secrets needed.
      LLM_BACKEND: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e . pytest
      - name: Tests
        run: python -m pytest tests -q
      - name: Eval harness (mock backend)
        run: majordomo eval --no-chart
